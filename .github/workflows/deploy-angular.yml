
name: Deploy Angular Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: |
          npx ng build --configuration production \
          --base-href "/${{ github.event.repository.name }}/"

      - name: Find Angular Build Output
        id: output
        run: |
          INDEX_FILE=$(find dist -type f -name index.html | head -n 1)
          if [ -z "$INDEX_FILE" ]; then
            echo "Angular build output not found"
            exit 1
          fi
          echo "path=$(dirname "$INDEX_FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
