name: Deploy Angular Application

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npx ng build --configuration production --base-href "/wealthpulse-ui/"

      - name: Verify GitHub Pages output
        run: |
          test -f dist/wealthpulse-ui/browser/index.html

          echo "Generated base href:"
          grep -o '<base href="[^"]*">' dist/wealthpulse-ui/browser/index.html

          grep -q '<base href="/wealthpulse-ui/">' dist/wealthpulse-ui/browser/index.html

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/wealthpulse-ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
